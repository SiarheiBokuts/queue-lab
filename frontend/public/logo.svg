<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="queue-lab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- messages waiting in a queue: three blocks, the front one is the longest -->
  <rect x="10" y="14" width="30" height="8" rx="4" fill="#fff"/>
  <rect x="10" y="28" width="24" height="8" rx="4" fill="#fff" opacity="0.78"/>
  <rect x="10" y="42" width="18" height="8" rx="4" fill="#fff" opacity="0.56"/>
  <!-- they flow out to the workers -->
  <path d="M44 24l11 8-11 8z" fill="#fff"/>
</svg>
