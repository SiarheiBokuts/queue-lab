[package]
name = "worker"
version = "0.1.0"
edition = "2021"
description = "queue-lab worker (Rust): Kafka producer and consumer behind one contract"

[dependencies]
# Confluent's librdkafka (built from source) wrapped for Rust: the same client family as the Python, Node.js and Go
# workers, so the Kafka settings are identical.
rdkafka = { version = "0.39", features = ["cmake-build"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.11"
getrandom = "0.3"
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
opt-level = 3